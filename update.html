<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ジムノート更新</title><style>body{font-family:sans-serif;background:#0e1114;color:#fff;padding:32px;line-height:1.7}b{color:#a8ef70}</style></head><body><h2>ジムノートを更新しています</h2><p>保存済みの体重・履歴・食事データは消しません。</p><p id="m"><b>キャッシュを整理中…</b></p><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('m').innerHTML='<b>更新完了。最新版を開きます…</b>';setTimeout(()=>location.replace('./index.html?v=561&fresh='+Date.now()),500)}catch(e){document.getElementById('m').textContent='更新に失敗しました。ブラウザを閉じてもう一度お試しください。'} })();</script></body></html>
