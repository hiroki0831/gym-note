<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ジムノート v5.7.1 更新</title>
<style>body{font-family:system-ui,sans-serif;background:#0e1114;color:#f4f6f7;padding:36px 20px;line-height:1.7;max-width:540px;margin:auto}h1{font-size:23px}b{color:#a8ef70}small{color:#9da9b2}a{color:#a8ef70}</style></head>
<body><h1>ジムノートを最新版に更新</h1><p>体重・食事・トレーニング履歴は削除しません。</p><p id="message"><b>古いアプリのキャッシュを整理しています…</b></p>
<script>
(async()=>{
 const msg=document.getElementById('message');
 try{
  if('serviceWorker'in navigator){
   const registrations=await navigator.serviceWorker.getRegistrations();
   const scope=new URL('./',location.href).href;
   await Promise.all(registrations.filter(r=>r.scope===scope).map(r=>r.unregister()));
  }
  if('caches'in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(k=>k.startsWith('gym-note-')).map(k=>caches.delete(k)));
  }
  msg.innerHTML='<b>準備完了。v5.7.1 を開きます…</b>';
  location.replace('./index.html?v=571&fresh='+Date.now());
 }catch(err){
  msg.innerHTML='自動更新できませんでした。<a href="./index.html?v=571">ここを押してv5.7.1を開く</a><br><small>'+String(err.message||'')+'</small>';
 }
})();
</script></body></html>
